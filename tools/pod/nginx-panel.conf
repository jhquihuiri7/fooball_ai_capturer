# El panel de football-ai, abierto a internet con usuario y clave (tools/pod.sh crea el
# fichero de claves). Instancia aparte de la que trae la imagen de RunPod:
#   nginx -c /root/football-ai/nginx-panel.conf
pid /run/nginx-panel.pid;
error_log /root/football-ai/nginx-panel.log warn;
events {}
http {
    access_log off;
    server {
        listen 8091;
        auth_basic "football-ai";
        auth_basic_user_file /root/football-ai/panel.htpasswd;
        client_max_body_size 2g;   # el panel deja subir vídeos de prueba y anuncios
        location / {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_buffering off;   # el vídeo es un MJPEG sin fin: nada de guardarlo
            proxy_read_timeout 3600s;
        }
    }
}
