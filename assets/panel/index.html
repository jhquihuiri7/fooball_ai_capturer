<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="color-scheme" content="dark">
<title>Mando · Gala Sports</title>
<!-- El panel local del maestro (IOS-64), con la marca Gala Sports (ADR 0026 del repo
     football-ai): sin framework, servido por la API del mando. El token viene en el
     fragmento de la URL del QR Mando (#mando=…), que el navegador nunca manda al
     servidor; las llamadas lo llevan en Authorization.
     Pensado primero para el móvil del operador: botones de 56 px o más, una columna, y
     dos columnas desde 900 px. Las fuentes vienen de Google Fonts si hay red; si no (la
     cancha sin internet), caen a las condensadas del sistema y la página aguanta igual. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    /* Paleta Ocean Electric (tools/brand.py de football-ai). */
    --teal: #00e5c4; --verde: #00a892; --azul: #0066ff;
    --profundo: #07111f; --marino: #101d2d; --tinte: #1c2a3c;
    --claro: #f8fafc; --oceanico: #94a3b8; --rojo: #e3141f; --amarillo: #ffd43b;
    --linea: rgba(148, 163, 184, .28);
    --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
    --sans: Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    --sesgo: -30deg;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--profundo); color: var(--claro);
    font: 15px/1.4 var(--sans);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* ---------------- cabecera ---------------- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: rgba(7, 17, 31, .94); border-bottom: 1px solid var(--linea);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .marca { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .franjas { display: flex; gap: 3px; }
  .franjas i { width: 7px; height: 20px; transform: skewX(var(--sesgo)); background: linear-gradient(180deg, var(--teal), var(--verde)); }
  .franjas i:nth-child(2) { background: var(--azul); }
  .franjas i:nth-child(3) { background: linear-gradient(0deg, #d3dfea, transparent); }
  .conexion { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--oceanico); }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--oceanico); }
  .conexion.ok .punto { background: var(--teal); box-shadow: 0 0 0 3px rgba(0, 229, 196, .2); }
  .conexion.mal .punto { background: var(--rojo); }
  .vivo {
    display: none; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 6px;
    background: var(--rojo); color: #fff; font: 800 12px/1 var(--sans); letter-spacing: .04em;
  }
  .vivo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
  .vivo.on { display: inline-flex; }

  main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 14px 16px 120px; display: grid; gap: 14px; }
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .ancho { grid-column: 1 / -1; }
  }
  .col { display: grid; gap: 14px; }

  /* ---------------- marcador ---------------- */
  .marcador {
    position: relative; overflow: hidden; padding: 16px 16px 14px; border-radius: 12px;
    background: linear-gradient(180deg, var(--marino), var(--profundo));
    box-shadow: inset 0 -3px 0 var(--azul), 0 4px 16px rgba(0, 0, 0, .4);
  }
  .equipos { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
  /* Los nombres se parten entre palabras, nunca dentro de una: con el cuerpo que baja con
     el ancho, «BELLAVISTA» cabe entero en un móvil de 360 px. */
  .equipo { min-width: 0; font: 700 clamp(15px, 4.4vw, 28px)/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: normal; word-break: normal; }
  .equipo.local { text-align: right; }
  .goles { display: flex; align-items: stretch; height: clamp(54px, 15vw, 72px); }
  .gol {
    display: flex; align-items: center; justify-content: center; min-width: clamp(46px, 13vw, 64px); padding: 0 10px;
    font: 800 clamp(38px, 11vw, 56px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--profundo);
    transform: skewX(var(--sesgo));
  }
  .gol > span { transform: skewX(30deg); }
  .gol.local { background: linear-gradient(180deg, var(--teal), var(--verde)); }
  .gol.visita { background: #fff; }
  .reloj-fila { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .reloj {
    padding: 4px 14px; border-radius: 6px; background: rgba(7, 17, 31, .88); box-shadow: inset 0 0 0 2px var(--oceanico);
    font: 700 clamp(30px, 9vw, 40px)/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .estado-reloj { font: 700 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--oceanico); }
  .estado-reloj.corre { color: var(--teal); }

  /* ---------------- tarjetas ---------------- */
  .card { padding: 14px; border-radius: 12px; background: var(--marino); box-shadow: 0 1px 2px #00000080, 0 8px 24px #00000059; }
  .card h2 {
    display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
    font: 600 11px/16px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--oceanico);
  }
  .card h2::before { content: ""; width: 4px; height: 14px; transform: skewX(var(--sesgo)); background: var(--teal); }

  /* ---------------- botones ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 14px;
    border: 0; border-radius: 12px; cursor: pointer; user-select: none; -webkit-user-select: none;
    font: 700 17px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase;
    background: var(--tinte); color: var(--claro); box-shadow: inset 0 0 0 1px var(--linea);
    transition: filter .12s, transform .06s, opacity .12s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--profundo), 0 0 0 4px var(--teal); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ocupado { opacity: .7; pointer-events: none; }
  .btn.hecho { box-shadow: inset 0 0 0 2px var(--teal); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .primario { background: var(--teal); color: var(--profundo); box-shadow: 0 6px 18px #00e5c459; }
  .acento { background: var(--azul); color: #fff; box-shadow: 0 6px 18px #0066ff59; }
  .blanco { background: #fff; color: var(--profundo); }
  .grande { min-height: 72px; font-size: 22px; }

  .goles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lado { display: grid; gap: 8px; min-width: 0; }
  .lado .nombre { font: 700 13px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--oceanico); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quitar { min-height: 44px; font-size: 15px; background: transparent; }

  .reloj-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .reloj-grid .toggle { grid-column: 1 / -1; }

  .alin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alin { flex-direction: column; gap: 4px; min-height: 64px; }
  .alin small { font: 600 11px/1 var(--sans); letter-spacing: .06em; color: var(--oceanico); text-transform: uppercase; }
  .alin[aria-pressed="true"] { background: var(--amarillo); color: var(--profundo); box-shadow: none; }
  .alin[aria-pressed="true"] small { color: var(--profundo); }

  /* ---------------- cámaras y soporte ---------------- */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2 { margin: 0; }
  details > summary h2::after { content: "▾"; margin-left: auto; font-size: 14px; transition: transform .15s; }
  details:not([open]) > summary h2::after { transform: rotate(-90deg); }
  details[open] > summary { margin-bottom: 12px; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .thumbs figure { margin: 0; min-width: 0; }
  .thumbs figure.programa { grid-column: 1 / -1; }
  .thumbs img { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 8px; background: #000; object-fit: cover; }
  figcaption { margin-top: 4px; font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--oceanico); }
  .datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 0; }
  .datos div { padding: 10px; border-radius: 8px; background: var(--tinte); min-width: 0; }
  .datos dt { font: 600 10px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--oceanico); }
  .datos dd { margin: 4px 0 0; font: 700 18px/1.1 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
  .datos .malo dd { color: #ff9a9c; }

  /* ---------------- formularios (ADR 0027) ---------------- */
  .campos { display: grid; gap: 10px; }
  .campos label { display: grid; gap: 4px; font: 600 11px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--oceanico); }
  .campos input[type=text] {
    min-height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--profundo); color: var(--claro);
    box-shadow: inset 0 0 0 1px var(--linea); font: 700 18px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
  }
  .campos input[type=text]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--teal); }
  .pareja { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .uno { grid-template-columns: 1fr; }
  details.editar > summary { margin-top: 10px; padding: 10px 0 0; border-top: 1px solid var(--linea); font: 600 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--oceanico); }
  details.editar[open] > summary { margin-bottom: 10px; }
  .cuenta { font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
  .icono-vista { display: flex; align-items: center; justify-content: center; height: 120px; border-radius: 10px; background: var(--profundo); box-shadow: inset 0 0 0 1px var(--linea); color: var(--oceanico); font-size: 13px; overflow: hidden; }
  .icono-vista img { max-width: 100%; max-height: 104px; object-fit: contain; }
  .subir { position: relative; overflow: hidden; }
  .campos label.btn { display: inline-flex; font: 700 17px/1.1 var(--display); letter-spacing: .04em; color: var(--claro); }
  .subir input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* ---------------- vídeos (ADR 0027) ---------------- */
  .sonando { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; background: var(--tinte); box-shadow: inset 0 0 0 1px var(--teal); }
  .sonando[hidden] { display: none; }
  .sonando b { display: block; font: 700 17px/1.15 var(--display); letter-spacing: .03em; overflow-wrap: anywhere; }
  .sonando small { font: 600 10px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
  .videos { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .videos li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--profundo); box-shadow: inset 0 0 0 1px var(--linea); }
  .videos li.suena { box-shadow: inset 0 0 0 2px var(--teal); }
  .videos .nombre { min-width: 0; font: 700 15px/1.2 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
  .videos .nombre small { display: block; font: 500 12px/1.3 var(--sans); letter-spacing: 0; color: var(--oceanico); }
  .videos .btn { min-height: 44px; padding: 0 12px; }
  .videos .vacio { display: block; padding: 12px; text-align: center; color: var(--oceanico); font-size: 13px; background: none; box-shadow: none; }
  .progreso { position: relative; height: 34px; margin-bottom: 10px; border-radius: 10px; background: var(--profundo); box-shadow: inset 0 0 0 1px var(--linea); overflow: hidden; }
  .progreso[hidden] { display: none; }
  .progreso i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--teal); opacity: .55; transition: width .2s; }
  .progreso span { position: relative; display: flex; align-items: center; justify-content: center; height: 100%; font: 700 14px/1 var(--display); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .subir.ancho { display: flex; width: 100%; }

  /* ---------------- avisos ---------------- */
  #aviso {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10; transform: translateX(-50%);
    width: min(520px, calc(100% - 32px)); padding: 12px 14px; border-radius: 12px;
    background: #2a1218; box-shadow: inset 0 0 0 1px rgba(227, 20, 31, .6), 0 8px 24px #00000080;
    color: #ffd6d8; font-weight: 600; display: none;
  }
  #aviso.on { display: block; }
  .sin-token { padding: 24px 16px; text-align: center; color: var(--oceanico); }
  .sin-token strong { display: block; margin-bottom: 6px; font: 700 22px/1.2 var(--display); text-transform: uppercase; color: var(--claro); }
</style>
</head>
<body>
<header>
  <div class="marca"><span class="franjas" aria-hidden="true"><i></i><i></i><i></i></span>Mando</div>
  <span class="vivo" id="vivo">EN VIVO</span>
  <div class="conexion" id="conexion" role="status"><span class="punto" aria-hidden="true"></span><span id="conexion-texto">conectando…</span></div>
</header>

<main>
  <section class="marcador ancho" aria-label="Marcador">
    <div class="equipos">
      <div class="equipo local" id="local">Local</div>
      <div class="goles" aria-live="polite">
        <div class="gol local"><span id="goles-local">0</span></div>
        <div class="gol visita"><span id="goles-visita">0</span></div>
      </div>
      <div class="equipo" id="visitante">Visitante</div>
    </div>
    <div class="reloj-fila">
      <span class="reloj" id="reloj">00:00</span>
      <span class="estado-reloj" id="estado-reloj">parado</span>
    </div>
  </section>

  <div class="col">
    <section class="card" aria-labelledby="t-goles">
      <h2 id="t-goles">Goles</h2>
      <div class="goles-grid">
        <div class="lado">
          <div class="nombre" id="nombre-local">Local</div>
          <button class="btn primario grande" data-gol="home,1" aria-label="Gol del local">+ Gol</button>
          <button class="btn quitar" data-gol="home,-1" aria-label="Quitar un gol al local">− 1</button>
        </div>
        <div class="lado">
          <div class="nombre" id="nombre-visitante">Visitante</div>
          <button class="btn blanco grande" data-gol="away,1" aria-label="Gol del visitante">+ Gol</button>
          <button class="btn quitar" data-gol="away,-1" aria-label="Quitar un gol al visitante">− 1</button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="t-reloj">
      <h2 id="t-reloj">Reloj</h2>
      <div class="reloj-grid">
        <button class="btn acento grande toggle" id="toggle" data-reloj="start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="icono-toggle" fill="currentColor" d="M8 5.2v13.6a.8.8 0 0 0 1.23.67l10.4-6.8a.8.8 0 0 0 0-1.34L9.23 4.53A.8.8 0 0 0 8 5.2z"/></svg>
          <span id="texto-toggle">Iniciar</span>
        </button>
        <button class="btn" data-nudge="-60" aria-label="Restar un minuto">−1 min</button>
        <button class="btn" data-nudge="60" aria-label="Sumar un minuto">+1 min</button>
        <button class="btn" data-reloj="reset" data-confirma="¿Poner el reloj a 00:00?">↺ Cero</button>
      </div>
    </section>

    <section class="card" aria-labelledby="t-equipos">
      <h2 id="t-equipos">Equipos</h2>
      <form class="campos" id="form-equipos">
        <label>Local<input type="text" id="in-local" maxlength="24" autocomplete="off" required></label>
        <label>Visitante<input type="text" id="in-visitante" maxlength="24" autocomplete="off" required></label>
        <button class="btn primario" type="submit">Guardar nombres</button>
      </form>
    </section>

    <section class="card" aria-labelledby="t-icono">
      <h2 id="t-icono">Icono del campeonato</h2>
      <div class="campos">
        <div class="icono-vista" id="icono-vista">sin icono</div>
        <div class="acciones">
          <label class="btn subir">Cargar icono<input type="file" id="in-icono" accept="image/png,image/jpeg"></label>
          <button class="btn quitar" id="quitar-icono" type="button" data-propio data-confirma="¿Quitar el icono del campeonato?">Quitar</button>
        </div>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="card" aria-labelledby="t-alin">
      <h2 id="t-alin">Al aire</h2>
      <div class="alin-grid">
        <button class="btn alin" data-alin="home" aria-pressed="false"><span id="alin-local">Local</span><small id="alin-local-estado">mostrar</small></button>
        <button class="btn alin" data-alin="away" aria-pressed="false"><span id="alin-visitante">Visitante</span><small id="alin-visitante-estado">mostrar</small></button>
        <button class="btn alin" style="grid-column: 1 / -1" id="entretiempo" data-propio aria-pressed="false"><span>Entretiempo</span><small id="entretiempo-estado">mostrar el marcador</small></button>
      </div>
    </section>

    <section class="card" aria-labelledby="t-franja">
      <h2 id="t-franja">Franja inferior</h2>
      <div class="acciones">
        <button class="btn acento" id="franja-sacar" type="button" data-propio>Sacar <span class="cuenta" id="franja-cuenta">15 s</span></button>
        <button class="btn" id="franja-ocultar" type="button" data-propio disabled>Ocultar</button>
      </div>
      <details class="editar">
        <summary>Editar textos</summary>
        <form class="campos" id="form-franja">
          <div class="pareja">
            <label>Claim 1<input type="text" name="claim" maxlength="32" autocomplete="off"></label>
            <label>Claim 2<input type="text" name="claim" maxlength="32" autocomplete="off"></label>
          </div>
          <div class="pareja">
            <label>Mensaje 1<input type="text" name="titulo" maxlength="32" autocomplete="off"></label>
            <label>Debajo<input type="text" name="sub" maxlength="32" autocomplete="off"></label>
          </div>
          <div class="pareja">
            <label>Mensaje 2<input type="text" name="titulo" maxlength="32" autocomplete="off"></label>
            <label>Debajo<input type="text" name="sub" maxlength="32" autocomplete="off"></label>
          </div>
          <div class="pareja">
            <label>Mensaje 3<input type="text" name="titulo" maxlength="32" autocomplete="off"></label>
            <label>Debajo<input type="text" name="sub" maxlength="32" autocomplete="off"></label>
          </div>
          <button class="btn primario" type="submit">Guardar textos</button>
        </form>
      </details>
    </section>

    <section class="card" aria-labelledby="t-videos">
      <h2 id="t-videos">Vídeos</h2>
      <div class="sonando" id="video-sonando" hidden>
        <div><small>Al aire</small><b id="video-nombre"></b></div>
        <span class="cuenta" id="video-cuenta">0:00</span>
        <button class="btn quitar" id="video-parar" type="button" data-propio>Parar</button>
      </div>
      <ul class="videos" id="videos"><li class="vacio">cargando…</li></ul>
      <div class="progreso" id="video-progreso" hidden><i id="video-barra"></i><span id="video-progreso-texto"></span></div>
      <div class="campos">
        <label class="btn subir ancho">Subir MP4<input type="file" id="in-video" accept="video/mp4,.mp4"></label>
      </div>
    </section>

    <section class="card" aria-labelledby="t-jugada">
      <h2 id="t-jugada">Repetición</h2>
      <button class="btn acento grande" style="width:100%" data-orden="clips/mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></g><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
        <span>Marcar jugada</span>
      </button>
    </section>
  </div>

  <details class="card ancho" open>
    <summary><h2>Cámaras y programa · 1 fps</h2></summary>
    <div class="thumbs">
      <figure class="programa"><img id="t-program" alt="Programa"><figcaption>Programa</figcaption></figure>
      <figure><img id="t-left" alt="Cámara izquierda"><figcaption>Izquierda</figcaption></figure>
      <figure><img id="t-right" alt="Cámara derecha"><figcaption>Derecha</figcaption></figure>
    </div>
  </details>

  <details class="card ancho">
    <summary><h2>Soporte</h2></summary>
    <dl class="datos" id="estado"><div><dt>Estado</dt><dd>—</dd></div></dl>
  </details>
</main>

<div id="aviso" role="alert"></div>

<script>
const token = new URLSearchParams(location.hash.slice(1)).get('mando') || '';
const cab = { 'Authorization': 'Bearer ' + token, 'X-Zero-Device': encodeURIComponent('panel web') };
const $ = id => document.getElementById(id);
let partido = null;
let recibido = 0; // performance.now() del último estado: el reloj avanza solo mientras corre

let avisoHasta = 0;
function aviso(t) {
  const el = $('aviso');
  el.textContent = t || '';
  el.classList.toggle('on', !!t);
  if (t) { avisoHasta = Date.now() + 5000; setTimeout(() => { if (Date.now() >= avisoHasta) el.classList.remove('on'); }, 5100); }
}
function conexion(ok, texto) {
  $('conexion').className = 'conexion ' + (ok ? 'ok' : 'mal');
  $('conexion-texto').textContent = texto;
}

const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function tic() {
  if (!partido) return;
  const ms = partido.clock_ms + (partido.clock_running ? performance.now() - recibido : 0);
  $('reloj').textContent = mmss(ms);
  // La franja: cuenta atrás mientras está fuera.
  const queda = Math.max(0, Math.ceil((franjaHasta - performance.now()) / 1000));
  $('franja-cuenta').textContent = queda > 0 ? queda + ' s' : '15 s';
  $('franja-sacar').classList.toggle('hecho', queda > 0);
  $('franja-ocultar').disabled = queda === 0;
  // El vídeo: lo que le queda mientras suena.
  if (partido.video) $('video-cuenta').textContent = mmss(Math.max(0, videoHasta - performance.now()) + 999);
}

const PLAY = 'M8 5.2v13.6a.8.8 0 0 0 1.23.67l10.4-6.8a.8.8 0 0 0 0-1.34L9.23 4.53A.8.8 0 0 0 8 5.2z';
const PAUSA = 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z';

function pinta(p) {
  if (!p || !p.home) return;
  partido = p; recibido = performance.now();
  $('local').textContent = p.home.name; $('visitante').textContent = p.away.name;
  $('nombre-local').textContent = p.home.name; $('nombre-visitante').textContent = p.away.name;
  $('alin-local').textContent = p.home.name; $('alin-visitante').textContent = p.away.name;
  $('goles-local').textContent = p.home.goals; $('goles-visita').textContent = p.away.goals;
  $('vivo').classList.toggle('on', !!p.streaming);
  const corre = !!p.clock_running;
  $('estado-reloj').textContent = corre ? 'en marcha' : 'parado';
  $('estado-reloj').classList.toggle('corre', corre);
  $('toggle').dataset.reloj = corre ? 'pause' : 'start';
  $('texto-toggle').textContent = corre ? 'Pausar' : (p.clock_ms > 0 ? 'Reanudar' : 'Iniciar');
  $('icono-toggle').setAttribute('d', corre ? PAUSA : PLAY);
  for (const lado of ['home', 'away']) {
    const b = document.querySelector('[data-alin="' + lado + '"]');
    const alAire = p.lineup_on_air === lado;
    const hay = (p[lado].players || 0) > 0;
    b.setAttribute('aria-pressed', alAire ? 'true' : 'false');
    b.disabled = !hay && !alAire;
    $((lado === 'home' ? 'alin-local' : 'alin-visitante') + '-estado').textContent = alAire ? 'al aire · quitar' : (hay ? 'mostrar' : 'sin alineación');
  }
  // Entretiempo, franja, nombres e icono (ADR 0027).
  const enDescanso = !!p.halftime_on_air;
  $('entretiempo').setAttribute('aria-pressed', enDescanso ? 'true' : 'false');
  $('entretiempo-estado').textContent = enDescanso ? 'al aire · quitar' : 'mostrar el marcador';
  franjaHasta = performance.now() + (p.strip_remaining_ms || 0);
  rellena($('in-local'), p.home.name); rellena($('in-visitante'), p.away.name);
  if (p.strip_texts) {
    const f = $('form-franja');
    f.querySelectorAll('[name=claim]').forEach((el, i) => rellena(el, p.strip_texts.claim[i]));
    f.querySelectorAll('[name=titulo]').forEach((el, i) => rellena(el, p.strip_texts.slots[i][0]));
    f.querySelectorAll('[name=sub]').forEach((el, i) => rellena(el, p.strip_texts.slots[i][1]));
  }
  if (p.championship_icon !== iconoVisto) { iconoVisto = p.championship_icon; pintaIcono(); }
  $('video-sonando').hidden = !p.video;
  if (p.video) { $('video-nombre').textContent = p.video.name.replace(/\.mp4$/i, ''); videoHasta = performance.now() + p.video.remaining_ms; }
  document.querySelectorAll('#videos li[data-nombre]').forEach(li => li.classList.toggle('suena', !!p.video && li.dataset.nombre === p.video.name));
  if (p.save_error) aviso('El maestro no pudo guardar el partido: ' + p.save_error);
  tic();
}

// Un campo se rellena con lo del maestro salvo mientras el operador lo está editando.
function rellena(el, valor) {
  if (document.activeElement !== el && !el.dataset.sucio) el.value = valor ?? '';
}
document.addEventListener('input', e => { if (e.target.matches('.campos input[type=text]')) e.target.dataset.sucio = '1'; });
const limpia = form => form.querySelectorAll('input').forEach(el => delete el.dataset.sucio);

let franjaHasta = 0;
let videoHasta = 0;
let iconoVisto;
async function pintaIcono() {
  const vista = $('icono-vista');
  $('quitar-icono').disabled = iconoVisto == null;
  if (iconoVisto == null) { vista.textContent = 'sin icono'; return; }
  try {
    const r = await fetch('/api/v1/assets/championship', { headers: cab });
    if (!r.ok) return;
    const img = document.createElement('img');
    img.alt = 'Icono del campeonato';
    img.src = URL.createObjectURL(await r.blob());
    vista.replaceChildren(img);
  } catch {}
}

$('form-equipos').addEventListener('submit', e => {
  e.preventDefault();
  orden('match/teams', { home: $('in-local').value.trim(), away: $('in-visitante').value.trim() }, e.submitter)
    .then(() => limpia($('form-equipos')));
});
$('form-franja').addEventListener('submit', e => {
  e.preventDefault();
  const f = $('form-franja');
  const val = n => [...f.querySelectorAll('[name=' + n + ']')].map(el => el.value.trim());
  const titulos = val('titulo'), subs = val('sub');
  orden('graphics/strip_texts', { claim: val('claim'), slots: titulos.map((t, i) => [t, subs[i]]) }, e.submitter)
    .then(() => limpia(f));
});
$('in-icono').addEventListener('change', async e => {
  const archivo = e.target.files[0]; e.target.value = '';
  if (!archivo) return;
  if (archivo.size > 4 * 1024 * 1024) { aviso('El icono pasa de 4 MB.'); return; }
  const boton = e.target.closest('.btn'); boton.classList.add('ocupado');
  try {
    const r = await fetch('/api/v1/assets/championship', { method: 'PUT', headers: { ...cab, 'Content-Type': archivo.type || 'application/octet-stream' }, body: archivo });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { pinta(j); aviso(''); } else aviso(j.detail || ('error ' + r.status));
  } catch { aviso('Sin conexión con el maestro: el icono no se subió.'); }
  finally { boton.classList.remove('ocupado'); }
});
$('quitar-icono').addEventListener('click', async e => {
  if (!confirm(e.currentTarget.dataset.confirma)) return;
  try {
    const r = await fetch('/api/v1/assets/championship', { method: 'DELETE', headers: cab });
    const j = await r.json().catch(() => ({}));
    if (r.ok) pinta(j); else aviso(j.detail || ('error ' + r.status));
  } catch { aviso('Sin conexión con el maestro.'); }
});
// ---------------- vídeos (ADR 0027) ----------------
const MAX_VIDEO = 1024 * 1024 * 1024;
const megas = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
// El nombre que acepta el maestro: letras, cifras, espacios y ._()-, y .mp4 al final.
function nombreVideo(n) {
  const base = n.replace(/\.[^.]*$/, '').replace(/[^\p{L}\p{N} ._()-]/gu, '_').replace(/^[^\p{L}\p{N}]+/u, '');
  return (base || 'video').slice(0, 75).trim() + '.mp4';
}
async function cargaVideos() {
  try {
    const r = await fetch('/api/v1/videos', { headers: cab });
    if (!r.ok) return;
    pintaVideos((await r.json()).videos || []);
  } catch {}
}
function pintaVideos(lista) {
  const ul = $('videos');
  if (!lista.length) { ul.innerHTML = '<li class="vacio">Sin vídeos. Sube un MP4 para pasarlo en el programa.</li>'; return; }
  ul.replaceChildren(...lista.map(v => {
    const li = document.createElement('li');
    li.dataset.nombre = v.name;
    li.classList.toggle('suena', !!(partido && partido.video && partido.video.name === v.name));
    const nombre = document.createElement('div');
    nombre.className = 'nombre';
    nombre.textContent = v.name.replace(/\.mp4$/i, '');
    const datos = document.createElement('small');
    datos.textContent = mmss(v.duration_ms) + ' · ' + megas(v.bytes);
    nombre.append(datos);
    const pasar = document.createElement('button');
    pasar.className = 'btn acento'; pasar.type = 'button'; pasar.dataset.propio = ''; pasar.textContent = 'Pasar';
    pasar.addEventListener('click', () => orden('video/play', { name: v.name }, pasar));
    const borrar = document.createElement('button');
    borrar.className = 'btn quitar'; borrar.type = 'button'; borrar.dataset.propio = ''; borrar.textContent = 'Borrar';
    borrar.setAttribute('aria-label', 'Borrar ' + v.name);
    borrar.addEventListener('click', async () => {
      if (!confirm('¿Borrar ' + v.name + '?')) return;
      try {
        const r = await fetch('/api/v1/videos/' + encodeURIComponent(v.name), { method: 'DELETE', headers: cab });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) aviso(j.detail || ('error ' + r.status));
      } catch { aviso('Sin conexión con el maestro.'); }
      cargaVideos();
    });
    li.append(nombre, pasar, borrar);
    return li;
  }));
}
$('in-video').addEventListener('change', e => {
  const archivo = e.target.files[0]; e.target.value = '';
  if (!archivo) return;
  if (archivo.size > MAX_VIDEO) { aviso('El vídeo pasa de 1 GB.'); return; }
  const nombre = nombreVideo(archivo.name);
  const boton = e.target.closest('.btn'); boton.classList.add('ocupado');
  const barra = $('video-progreso');
  barra.hidden = false; $('video-barra').style.width = '0';
  $('video-progreso-texto').textContent = nombre + ' · 0 %';
  // XMLHttpRequest y no fetch: es lo que da el progreso de la subida.
  const x = new XMLHttpRequest();
  x.open('PUT', '/api/v1/videos/' + encodeURIComponent(nombre));
  for (const [k, v] of Object.entries(cab)) x.setRequestHeader(k, v);
  x.setRequestHeader('Content-Type', 'video/mp4');
  x.upload.onprogress = ev => {
    if (!ev.lengthComputable) return;
    const pc = Math.floor(100 * ev.loaded / ev.total);
    $('video-barra').style.width = pc + '%';
    $('video-progreso-texto').textContent = nombre + ' · ' + pc + ' %';
  };
  const fin = () => { boton.classList.remove('ocupado'); barra.hidden = true; cargaVideos(); };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch {}
    if (x.status === 200) aviso(''); else aviso(j.detail || ('error ' + x.status));
    fin();
  };
  x.onerror = () => { aviso('Sin conexión con el maestro: el vídeo no se subió.'); fin(); };
  x.send(archivo);
});
$('video-parar').addEventListener('click', e => orden('video/stop', {}, e.currentTarget));

$('franja-sacar').addEventListener('click', e => orden('graphics/strip', { show_s: 15 }, e.currentTarget));
$('franja-ocultar').addEventListener('click', e => orden('graphics/strip', { show_s: 0 }, e.currentTarget));
$('entretiempo').addEventListener('click', e => orden('graphics/halftime', { on_air: !(partido && partido.halftime_on_air) }, e.currentTarget));

async function orden(ruta, cuerpo, boton) {
  if (boton) boton.classList.add('ocupado');
  try {
    const r = await fetch('/api/v1/' + ruta, { method: 'POST', headers: { ...cab, 'Content-Type': 'application/json',
      'Idempotency-Key': crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) }, body: JSON.stringify(cuerpo) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      pinta(j); aviso('');
      if (boton) { boton.classList.add('hecho'); setTimeout(() => boton.classList.remove('hecho'), 700); }
    } else { aviso(j.detail || ('error ' + r.status)); if (j.state) pinta(j.state); }
  } catch { aviso('Sin conexión con el maestro: la orden no llegó.'); }
  finally { if (boton) boton.classList.remove('ocupado'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !partido || b.disabled || b.type === 'submit' || 'propio' in b.dataset) return;
  if (b.dataset.confirma && !confirm(b.dataset.confirma)) return;
  if (navigator.vibrate) navigator.vibrate(12);
  if (b.dataset.gol) { const [team, d] = b.dataset.gol.split(','); orden('match/goal', { team, delta: +d, expect: partido[team].goals }, b); }
  if (b.dataset.reloj) orden('match/clock', { action: b.dataset.reloj }, b);
  if (b.dataset.nudge) orden('match/clock', { action: 'nudge', seconds: +b.dataset.nudge }, b);
  if (b.dataset.alin) orden('match/lineup', { team: b.dataset.alin, on_air: partido.lineup_on_air !== b.dataset.alin }, b);
  if (b.dataset.orden) orden(b.dataset.orden, {}, b);
});

async function espera() {
  for (;;) {
    try {
      const since = partido ? '?since=' + partido.boot + ':' + partido.rev : '';
      const r = await fetch('/api/v1/match' + since, { headers: cab });
      if (r.ok) { pinta(await r.json()); conexion(true, 'conectado'); }
      else {
        const j = await r.json().catch(() => ({}));
        conexion(false, r.status === 401 || r.status === 410 ? 'QR caducado' : 'error ' + r.status);
        aviso(j.detail || ('error ' + r.status));
        await new Promise(f => setTimeout(f, 2000));
      }
    } catch {
      conexion(false, 'sin conexión');
      await new Promise(f => setTimeout(f, 2000));
    }
  }
}

const urls = {};
const NOMBRES = { role: 'Rol', link: 'Enlace', peer: 'Pareja', term: 'Turno', fps: 'FPS', thermal: 'Temperatura',
  pressure: 'Presión', ladder: 'Escalera', battery: 'Batería', dropped_frames: 'Frames perdidos', stream: 'Emisión',
  rec_clock_wait_frames: 'Espera del reloj', rec_clock_jump_segments: 'Saltos del reloj' };
const MALOS = { thermal: ['serious', 'critical'], link: ['down', 'disconnected', 'lost'], stream: ['failed', 'error'] };
function valor(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'battery' && typeof v === 'number') return v < 0 ? '—' : Math.round(v <= 1 ? v * 100 : v) + ' %';
  if (k === 'fps' && typeof v === 'number') return v.toFixed(1);
  if (k === 'ladder' && typeof v === 'number') return 'L' + v;
  return String(v);
}
function pintaEstado(s) {
  $('estado').replaceChildren(...Object.entries(s).map(([k, v]) => {
    const d = document.createElement('div');
    if ((MALOS[k] || []).includes(v)) d.className = 'malo';
    const dt = document.createElement('dt'); dt.textContent = NOMBRES[k] || k;
    const dd = document.createElement('dd'); dd.textContent = valor(k, v);
    d.append(dt, dd); return d;
  }));
}
async function miniaturas() {
  if (document.hidden) return; // en segundo plano no se gastan datos ni batería
  for (const n of ['left', 'right', 'program']) {
    try {
      const r = await fetch('/api/v1/rig/thumb/' + n, { headers: cab });
      if (!r.ok) continue;
      const u = URL.createObjectURL(await r.blob());
      $('t-' + n).src = u; if (urls[n]) URL.revokeObjectURL(urls[n]); urls[n] = u;
    } catch {}
  }
  try { const r = await fetch('/api/v1/rig/status', { headers: cab }); if (r.ok) pintaEstado(await r.json()); } catch {}
}

if (token) {
  espera(); miniaturas(); cargaVideos(); setInterval(miniaturas, 1000); setInterval(tic, 250);
  setInterval(cargaVideos, 30000); // lo que suban otros mandos
} else {
  conexion(false, 'sin token');
  document.querySelector('main').innerHTML =
    '<div class="sin-token ancho"><strong>Falta el QR Mando</strong>Abre esta página escaneando el QR «Mando» del móvil que emite.</div>';
}
</script>
</body>
</html>
