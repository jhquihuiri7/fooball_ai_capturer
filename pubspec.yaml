name: football_ai_capture
description: "Zero — la app que convierte dos iPhone en la cámara del sistema football-ai."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # El marcador y las alineaciones sobreviven a cerrar la app en el descanso.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Sin `google_fonts` a propósito: la app arranca en una cancha sin red, y una fuente
  # que no descarga es una pantalla ilegible. Los .ttf viajan dentro del binario.
  fonts:
    # Archivo — cifras grandes y titulares: cronómetro, goles, GRABAR, títulos.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    # IBM Plex Sans — botones, nombres de jugador, texto corrido.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # IBM Plex Mono — todo dato técnico: ms, ppm, Mbit/s, resoluciones, nombres de fichero.
    # 600 y 700 no estaban en la lista del encargo, pero el diseño los usa (GRABANDO,
    # dorsales, goles de la tira). Sin ellos Flutter cae a 500 sin avisar: no sintetiza
    # negritas de una familia propia.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

# El icono es solo la marca: dos anillos solapados al 72 % del lienzo sobre #12181A.
# Ni esquinas redondeadas ni sombras propias — iOS y Android aplican su máscara.
flutter_launcher_icons:
  image_path: assets/brand/zero-icon-1024.png
  ios: true
  # La App Store rechaza iconos con canal alfa.
  remove_alpha_ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#12181A"
  adaptive_icon_foreground: assets/brand/zero-icon-foreground.png
  # Sin margen extra: el PNG ya trae la marca al 60 % del lienzo, que es la zona segura
  # del icono adaptativo. El 16 % por omisión lo contaría dos veces y la marca saldría
  # a un 40 %, visiblemente más pequeña que el resto de iconos del movil.
  adaptive_icon_foreground_inset: 0

# El splash nativo y el primer frame de Flutter comparten color: sin esto se ve un
# destello blanco entre uno y otro. La app es oscura siempre; un splash claro deslumbra
# en la cancha de noche, así que `color_dark` es el mismo.
flutter_native_splash:
  color: "#12181A"
  color_dark: "#12181A"
  image: assets/brand/zero-splash.png
  fullscreen: true
  android_12:
    image: assets/brand/zero-splash-android12.png
    color: "#12181A"
    icon_background_color: "#12181A"
